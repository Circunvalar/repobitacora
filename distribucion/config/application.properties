# ════════════════════════════════════════════════════════════════════
#  Bitácora Digital · configuración de este equipo
#  Después de cambiar algo, cierre la ventana del programa y vuelva a abrir Iniciar-Bitacora.bat
# ════════════════════════════════════════════════════════════════════

# ─── Wolkvox ────────────────────────────────────────────────────────
# Ya no se configura aquí. Cada campaña principal (con su servidor wvXXXX y su token)
# se registra dentro del programa, en la pestaña "Campañas y servidores".
# El token se prueba contra Wolkvox antes de guardarse y nunca se muestra completo.

# ─── Carpetas ───────────────────────────────────────────────────────
# Carpeta donde se dejan los CSV a cargar (puede ser una carpeta de SharePoint/OneDrive sincronizada).
bitacora.carpetas.entrada=./datos/entrada
bitacora.carpetas.procesados=./datos/procesados
bitacora.carpetas.rechazados=./datos/rechazados
# Excel de la bitácora (se reescribe completo en cada cambio).
bitacora.excel.ruta=./datos/Bitacora.xlsx

# ─── Operación ──────────────────────────────────────────────────────
bitacora.catalogos.jefes=KELLY MARTIN,CORDINADORES REINTEGRA,TRAFICO DIGITAL
# Cada cuánto se revisa qué campañas están activas (Wolkvox recomienda 5 minutos o más).
bitacora.campanas.escaneo=5m
# true = la app enciende y apaga las campañas según el horario planeado de cada cargue.
bitacora.campanas.auto-activar=false

# ─── Programa ───────────────────────────────────────────────────────
quarkus.http.port=4444
# localhost = solo este equipo. 0.0.0.0 = otros equipos de la red pueden entrar (sin usuario/clave).
quarkus.http.host=localhost
