# ─── Bitácora Digital ───────────────────────────────────────────────
bitacora.zona-horaria=America/Bogota

# Carpetas (puede ser la carpeta de SharePoint sincronizada, p. ej. C:/Users/<usuario>/<Empresa>/Bases/Cargue)
bitacora.carpetas.entrada=${BITACORA_ENTRADA:./datos/entrada}
bitacora.carpetas.procesados=${BITACORA_PROCESADOS:./datos/procesados}
bitacora.carpetas.rechazados=${BITACORA_RECHAZADOS:./datos/rechazados}

# Excel nuevo, copia del actual
bitacora.excel.ruta=${BITACORA_EXCEL:./datos/Bitacora.xlsx}
bitacora.excel.hoja=Bitacora

# Validación según la plantilla de cargue de Wolkvox (nombres normalizados: minúsculas, sin tildes ni espacios)
bitacora.validacion.columnas-id=id,identificacion,documento,cedula,idcliente,dni
bitacora.validacion.columnas-nombre=nombre,nombres,name,nombrecliente
bitacora.validacion.patron-columna-telefono=^(tel|telefono)\\d{1,2}$|^(otrotel|telextra)$
bitacora.validacion.telefono-min-digitos=7
bitacora.validacion.telefono-max-digitos=15
bitacora.validacion.largo-maximo-campo=100
bitacora.validacion.largos-especiales=tipoid=20,edad=10,sexo=10,idagent=10,opt7=200,opt8=200,opt9=200,opt10=200,opt11=200,opt12=200,tel1=150

# Cargue
bitacora.cargue.tamano-lote=10000
bitacora.cargue.permitir-duplicados=false

# Wolkvox: "simulado" para probar sin token, "http" para la API real
bitacora.wolkvox.modo=${WOLKVOX_MODO:simulado}
bitacora.wolkvox.servidor=${WOLKVOX_SERVIDOR:}
bitacora.wolkvox.token=${WOLKVOX_TOKEN:}
bitacora.wolkvox.max-concurrencia=2
# PENDIENTE: confirmar contra la colección de Postman de Wolkvox
bitacora.wolkvox.endpoints.campanas=campaign.php?api=campaigns
bitacora.wolkvox.endpoints.cargar-registros=campaign.php?api=upload_records
bitacora.wolkvox.endpoints.iniciar=campaign.php?api=start
bitacora.wolkvox.endpoints.detener=campaign.php?api=stop
bitacora.wolkvox.endpoints.agentes-por-hora=reports_manager.php?api=agent_8
bitacora.wolkvox.endpoints.interacciones=reports_manager.php?api=interactions_detail

# Activar/detener según el horario planeado de cada cargue
bitacora.campanas.auto-activar=false

# Métricas: al minuto 2 de cada hora
bitacora.metricas.cron=0 2 * * * ?

bitacora.catalogos.jefes=KELLY MARTIN,CORDINADORES REINTEGRA,TRAFICO DIGITAL

# ─── Quarkus ─────────────────────────────────────────────────────────
quarkus.http.port=8080
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./datos/bitacora;MODE=PostgreSQL;AUTO_SERVER=TRUE
quarkus.datasource.username=sa
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.datasource.devservices.enabled=false
quarkus.smallrye-openapi.info-title=Bitácora Digital
quarkus.swagger-ui.always-include=true
quarkus.default-locale=es-CO

# PostgreSQL: compilar y arrancar con -Dquarkus.profile=pg
%pg.quarkus.datasource.db-kind=postgresql
%pg.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/bitacora}
%pg.quarkus.datasource.username=${DB_USER:bitacora}
%pg.quarkus.datasource.password=${DB_PASSWORD:}

# Pruebas: base en memoria y carpetas temporales
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:bitacora;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%test.bitacora.carpetas.entrada=target/prueba/entrada
%test.bitacora.carpetas.procesados=target/prueba/procesados
%test.bitacora.carpetas.rechazados=target/prueba/rechazados
%test.bitacora.excel.ruta=target/prueba/Bitacora.xlsx
%test.bitacora.metricas.cron=off
